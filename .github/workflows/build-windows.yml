name: Build Windows EXE

on:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - name: Install Flet CLI
        run: pip install flet

      - name: Build Windows
        run: flet build windows --project "CE-19" --org "com.codigoescondido19"
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"

      - name: Compress output
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/* -DestinationPath CE19-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ce19-windows
          path: CE19-windows.zip

      - name: Release Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-desktop
          name: "CE-19 Desktop"
          files: CE19-windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
