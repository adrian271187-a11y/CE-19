name: Publicar app web en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.85.3" "flet-audio==0.85.3"

      - name: Construir version web
        run: |
          flet build web --yes --no-rich-output --skip-flutter-doctor --cleanup-app \
            --exclude .git .github .venv env build dist dist_windows backups logs storage \
            instalador __pycache__ "*.pyc" README.md .gitignore \
            datos/exportaciones datos/historial.json datos/guardados.json \
            datos/carpetas.json datos/config_tiempo.json \
            datos/analisis_colores_historial.json \
            datos/historial_referencias_biblia.json \
            datos/favoritos_biblia.json datos/notas_biblia.json \
            datos/resaltados_biblia.json datos/ultima_lectura_biblia.json

      - name: Agregar pantalla de carga
        run: |
          python3 - <<'EOF'
          import re

          with open("build/web/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          loading_screen = """
          <style>
            #loading-screen {
              position: fixed;
              inset: 0;
              background: linear-gradient(160deg, #3b1a0a 0%, #6b2800 40%, #8b3a00 70%, #c45200 100%);
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              z-index: 9999;
              font-family: 'Segoe UI', sans-serif;
              transition: opacity 0.6s ease;
            }
            #loading-screen.oculto {
              opacity: 0;
              pointer-events: none;
            }
            .loading-titulo {
              color: #f5c842;
              font-size: 1.6rem;
              font-weight: 700;
              letter-spacing: 3px;
              margin-bottom: 6px;
              text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            }
            .loading-subtitulo {
              color: #f4a04a;
              font-size: 0.85rem;
              margin-bottom: 40px;
              letter-spacing: 2px;
              opacity: 0.85;
            }
            .loading-spinner {
              width: 42px;
              height: 42px;
              border: 3px solid rgba(255,255,255,0.15);
              border-top-color: #f5c842;
              border-radius: 50%;
              animation: spin 0.9s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
          </style>
          <div id="loading-screen">
            <div class="loading-titulo">CÓDIGO ESCONDIDO 19</div>
            <div class="loading-subtitulo">Iniciando aplicación...</div>
            <div class="loading-spinner"></div>
          </div>
          <script>
            window.addEventListener("flutter-first-frame", function() {
              var el = document.getElementById("loading-screen");
              if (el) {
                el.classList.add("oculto");
                setTimeout(function(){ el.remove(); }, 700);
              }
            });
          </script>
          """

          html = re.sub(r'(<body[^>]*>)', r'\1' + loading_screen, html, count=1)

          with open("build/web/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("Pantalla de carga inyectada correctamente.")
          EOF

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CE_19_7FC31 }}
          channelId: live
          projectId: ce-19-7fc31
